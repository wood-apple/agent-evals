[project]
name = "evals"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.110.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
evals = "evals.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
